<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Edit Task</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f7f9fa;
            color: #333;
            max-width: 450px;
            margin: 80px auto;
            padding: 30px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }
        h2 { color: #2c3e50; text-align: center; margin-bottom: 20px; }
        form { display: flex; flex-direction: column; gap: 15px; }
        label { font-weight: 600; font-size: 14px; color: #555; }
        input[type="text"], input[type="date"] {
            padding: 12px 15px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .btn-group { 
            display: flex; 
            gap: 10px; 
            margin-top: 10px; 
        }
        .btn-save, .btn-cancel {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }
        .btn-save { background-color: #2ecc71; color: white; }
        .btn-save:hover { background-color: #27ae60; }
        .btn-cancel { background-color: #ff0000; color: white; }
        .btn-cancel:hover { background-color: #ff3737; }
    </style>
</head>
<body>
    <h2>Edit Task</h2>

    <form action="#" th:action="@{/update/{id}(id=${task.id})}" method="post">
        <label for="title">Task Title:</label>
        <input type="text" id="title" name="title" th:value="${task.title}" required />

        <label for="dueDate">Due Date:</label>
        <input type="date" id="dueDate" name="dueDate" th:value="${task.dueDate}" required />

        <div class="btn-group">
            <button type="submit" class="btn-save">Save Changes</button>
            <a href="/" class="btn-cancel">Cancel</a>
        </div>
    </form>
</body>
</html>
